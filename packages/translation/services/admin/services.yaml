services:
    '@enhavo/translation/components/FormTranslation.vue':
        static: true
        chunk: 'translation'
        tags:
            - { name: vue.component, component: 'form-translation' }

    '@enhavo/translation/manager/TranslationManager':
        import: TranslationManager
        chunk: 'translation'
