services:
    '@enhavo/framework/translation/Translator':
        chunk: 'app'
        import: Translator
        calls:
            - [ setData, [ 'param:translations' ] ]
        tags:
            - { name: vue.service, service: 'translator' , lazy: true }

    '@enhavo/app/view/DataLoader[translations]':
        init: true
        from: '@enhavo/app/view/DataLoader'
        arguments:
            - 'string:translations'
            - 'string:translations'
            - 'container:'
