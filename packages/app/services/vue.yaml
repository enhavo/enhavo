services:
    '@enhavo/framework/vue/VueRouterFactory':
        import: VueRouterFactory
        chunk: 'app'
        arguments:
            - '@enhavo/framework/vue/VueFactory'
            - 'param:vue_routes'

    '@enhavo/app/view/DataLoader[vue_routes]':
        init: true
        from: '@enhavo/app/view/DataLoader'
        arguments:
            - 'string:vue_routes'
            - 'string:vue_routes'
            - 'container:'

    '@enhavo/framework/controllers/VueController':
        chunk: 'app'
        static: true
        tags:
            - { name: stimulus.controller, key: 'vue' }
