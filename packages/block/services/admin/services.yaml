services:
    '@enhavo/block/tab/BlockTab':
        import: BlockTab
        chunk: 'block'
        arguments:
            - '@enhavo/app/action/ActionManager'
        tags:
            - { name: 'enhavo_app.tab' }

    '@enhavo/block/action/BlockCollapseAction':
        import: BlockCollapseAction
        chunk: 'block'
        arguments:
            - '@enhavo/app/manager/ResourceInputManager'
        tags:
            - { name: 'enhavo_app.action' }
