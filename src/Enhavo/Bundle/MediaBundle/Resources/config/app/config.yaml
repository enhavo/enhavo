doctrine:
    orm:
        resolve_target_entities:
            Enhavo\Bundle\MediaBundle\Model\FileInterface: Enhavo\Bundle\MediaBundle\Entity\File
            Enhavo\Bundle\MediaBundle\Model\FormatInterface: Enhavo\Bundle\MediaBundle\Entity\Format

enhavo_framework:
    template_paths:
        enhavo_media:
            path: '@EnhavoMediaBundle/Resources/views'
            alias: EnhavoMedia
            priority: 10

enhavo_api:
    documentation:
        section:
            admin:
                Enhavo\Bundle\MediaBundle\Documentation\MediaFileDescriber: ~

enhavo_media:
    formats:
        enhavoTableThumb:
            type: image
            width: 60
            height: 60
        enhavoPreviewThumb:
            type: image
            width: 72
            height: 72
    form:
        default:
            route: enhavo_media_admin_api_file_upload
            actions_file:
                download:
                    type: media_download
                format:
                    type: media_format

enhavo_app:
    roles:
        enhavo_media_file_show:
            role: ROLE_ENHAVO_MEDIA_FILE_SHOW
            label: media.role.file.label.show
            translation_domain: EnhavoMediaBundle
        enhavo_media_file_create:
            role: ROLE_ENHAVO_MEDIA_FILE_CREATE
            label: media.role.file.label.create
            translation_domain: EnhavoMediaBundle
