enhavo_content:
    structured_data:
        Enhavo\Bundle\ArticleBundle\Entity\Article:
            class:
                -
                    type: article
            properties:
                title:
                    -
                        type: article
                        property: headline
                picture:
                    -
                        type: article
                        property: image
                        transform: media_url
                        transform_options:
                            format: '%enhavo_article.structured_data.article_image_format%'
                teaser:
                    -
                        type: article
                        property: 'description'
                        transform: 'html_text'
                content:
                    -
                        type: model
