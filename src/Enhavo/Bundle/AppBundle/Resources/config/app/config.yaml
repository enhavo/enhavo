framework:
    translator: { fallback: "%locale%" }
    validation:
        enabled: true
    session:
        cookie_lifetime: 25920000

enhavo_api:
    documentation:
        section:
            admin:
                Enhavo\Bundle\ApiBundle\Documentation\InfoDescriber:
                    title: 'Admin'
                    description: 'Admin api documentation'
                Enhavo\Bundle\ApiBundle\Documentation\RouteDescriber:
                    section: admin
enhavo_app:
    locale: "%locale%"
    template_paths:
        enhavo_app:
            path: '@EnhavoAppBundle/Resources/views'
            alias: 'EnhavoApp'
            priority: 10
