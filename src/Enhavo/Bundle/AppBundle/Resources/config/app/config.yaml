framework:
    translator: { fallback: "%locale%" }
    validation:
        enabled: true
    session:
        cookie_lifetime: 25920000

enhavo_api:
    documentation:
        section:
            admin:
                info:
                    title: 'Admin'
                    description: 'Admin api documentation'
                    version: '1'
enhavo_framework:
    locale: "%locale%"
    template_paths:
        enhavo_app:
            path: '@EnhavoAppBundle/Resources/views'
            alias: 'EnhavoApp'
            priority: 10
