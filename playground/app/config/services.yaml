parameters:
    locale: en

services:
    _defaults:
        autowire: false
        autoconfigure: false

    App\:
        resource: '../src'
        autowire: true
        autoconfigure: true

    app.multi-tenancy.provider:
        class: Enhavo\Bundle\MultiTenancyBundle\Provider\ConfigurationProvider
        arguments:
            -  { de: { name: Deutsch, role: ROLE_LANGUAGE_DE, baseUrl: enhavo.de, domains: [ dev.enhavo.de ] }, en: { name: English, role: ROLE_LANGUAGE_EN, baseUrl: enhavo.com, domains: [ dev.enhavo.com ] } }

when@test:
    services:
        Enhavo\Bundle\UserBundle\Behat\Controller\SecurityController:
            arguments:
                - '@Enhavo\Bundle\UserBundle\User\UserManager'
                - '@enhavo_user.user.repository'
            tags: ['controller.service_arguments']
